<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Editar Datos de Persona</h2>
        <form action="/actualizar" method="POST">
            <!-- Enviamos el ID oculto para saber a quién actualizar -->
            <input type="hidden" name="id" value="{{ persona.id_persona }}">

            <div class="mb-3">
                <label class="form-label">Nombres</label>
                <input type="text" class="form-control" name="nombres" value="{{ persona.nombres }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Apellido Paterno</label>
                <input type="text" class="form-control" name="apaterno" value="{{ persona.apaterno }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Apellido Materno</label>
                <input type="text" class="form-control" name="amaterno" value="{{ persona.amaterno }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" name="telefono" value="{{ persona.telefono }}" required>
            </div>

            <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
            <a href="/clientes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
