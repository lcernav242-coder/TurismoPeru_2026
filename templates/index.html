<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turismo Perú - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Sistema Turismo Perú</h2>

        <!-- Barra de acciones: Buscador y Registro -->
        <div class="row mb-4">
            <div class="col-md-8">
                <form action="/buscar_dni" method="POST" class="d-flex gap-2">
                    <input type="text" class="form-control" name="dni_buscar" placeholder="Buscar por DNI (8 dígitos)..." maxlength="8" required>
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a href="/" class="btn btn-secondary">Limpiar</a>
                </form>
            </div>
            <div class="col-md-4 text-end">
                <a href="/nuevo" class="btn btn-success">Registrar Nueva Persona</a>
            </div>
        </div>

        <!-- Tabla de Personas -->
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Ap. Paterno</th>
                    <th>Ap. Materno</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in personas %}
                <tr>
                    <td>{{ p.id_persona }}</td>
                    <td>{{ p.nombres }}</td>
                    <td>{{ p.apaterno }}</td>
                    <td>{{ p.amaterno }}</td>
                    <td>{{ p.numero_documento }}</td>
                    <td>{{ p.telefono }}</td>
                    <td>
                        <a href="/editar/{{ p.id_persona }}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="/eliminar/{{ p.id_persona }}" class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Eliminar registro?')">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
